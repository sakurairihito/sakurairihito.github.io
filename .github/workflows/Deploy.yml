name: Build and Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Test publication summaries
        run: julia --project=. test/runtests.jl

      - name: Build website
        run: julia --project=. -e 'using Franklin; optimize(minify=false, prerender=false, clear=true, suppress_errors=false, fail_on_warning=true)'

      - name: Verify public notes and excluded content
        run: |
          for page in research compression fourier-pricing asian-barrier; do
            test -f "__site/$page/index.html"
          done
          test -f __site/ideas/index.html
          grep -q 'staticryptEncryptedMsgUniqueVariableName' __site/ideas/index.html
          test ! -f ideas.md
          for path in menu1 menu3 password menu1_copy menu4_copy; do
            if [ -e "__site/$path" ]; then
              echo "Refusing to publish private content: $path"
              exit 1
            fi
          done

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: __site
